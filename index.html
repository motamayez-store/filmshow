<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فيلم شوو - أفلام ومسلسلات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* الأساسيات */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0f0f0f;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Header */
        header {
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #ff4d2b;
        }

        header .container { display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 2rem; color: #ff4d2b; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); cursor: pointer; }

        /* البحث مع زر المفضلات */
        .search-box {
            display: flex; gap: 10px; background: rgba(255,255,255,0.1);
            border-radius: 50px; padding: 5px; align-items: center;
        }
        .search-box input {
            background: transparent; border: none; outline: none;
            color: #fff; padding: 12px 20px; flex: 1; font-size: 1rem;
        }
        .search-box button {
            background: #ff4d2b; border: none; color: white;
            width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
        }
        #favListBtn {
            background: none; border: none; color: #ff4d2b;
            font-size: 24px; cursor: pointer; margin-right: 15px; transition: 0.3s;
        }
        #favListBtn:hover { transform: scale(1.2); }

        /* Hero Section */
        #heroSection {
            width: 100%; height: 500px; background-size: cover; background-position: center;
            display: flex; align-items: flex-end; margin-bottom: 30px;
            transition: background 1s ease-in-out; position: relative;
        }
        .hero-content {
            background: rgba(0, 0, 0, 0.75); padding: 30px; margin: 20px;
            border-radius: 15px; max-width: 650px; border-right: 5px solid #ff4d2b;
        }

        /* كروت الأفلام */
        .movies-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px; padding: 20px 0;
        }
        .movie-card {
            background: #1a1a1a; border-radius: 15px; overflow: hidden;
            position: relative; transition: 0.3s; text-align: center; border: 1px solid #333;
            cursor: pointer;
        }
        .movie-card:hover { transform: translateY(-10px); border-color: #ff4d2b; }
        .movie-card img { width: 100%; height: 300px; object-fit: cover; }

        /* منطقة الأزرار والمعلومات */
        .movie-info { padding: 15px 10px; }
        .title-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; height: 35px; }
        .movie-info h3 { font-size: 13px; margin: 0; overflow: hidden; text-align: right; flex: 1; }
        .fav-icon-inline { color: #ff4d2b; cursor: pointer; font-size: 18px; transition: 0.3s; }
        .fav-icon-inline:hover { transform: scale(1.2); }

        .card-buttons {
            display: flex; gap: 10px; justify-content: center;
        }

        .btn-details {
            flex: 1; background: #ff4d2b; color: white; border: none;
            padding: 10px; border-radius: 12px; font-weight: bold; font-size: 12px;
            cursor: pointer; transition: 0.3s;
        }

        .btn-trailer {
            flex: 1; background: transparent; color: white; border: 1px solid #ff4d2b;
            padding: 10px; border-radius: 12px; font-weight: bold; font-size: 12px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-trailer:hover { background: #ff4d2b; }

        /* الأقسام */
        .categories { margin: 20px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .cat-btn {
            background: #222; color: white; border: 1px solid #444;
            padding: 10px 25px; border-radius: 25px; cursor: pointer; transition: 0.3s;
        }
        .cat-btn.active { background: #ff4d2b; border-color: #ff4d2b; }

        /* التاجات الملونة */
        .rating-tag { position: absolute; top: 10px; left: 10px; padding: 5px 10px; border-radius: 5px; font-weight: bold; z-index: 10; background: rgba(0,0,0,0.7); }
        .extra-tags { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 5px; z-index: 10; }
        .data-tag { background: rgba(0, 0, 0, 0.75); padding: 2px 8px; border-radius: 4px; font-size: 10px; border-right: 3px solid #ff4d2b; color: #fff; }
        .good { background-color: #2ecc71 !important; color: white; }

        /* Footer المخصص يا كرانشي */
        footer { 
            text-align: center; 
            padding: 40px 20px; 
            border-top: 1px solid #1a1a1a; 
            margin-top: auto; 
            background: #0a0a0a;
            direction: rtl;
        }
        .footer-credit { font-size: 18px; margin-bottom: 8px; }
        .footer-credit span { color: #ff4d2b; font-weight: bold; }
        .footer-rights { font-size: 12px; color: #666; }
   
    /* كود التنسيق واللمعة */
.tech-footer {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 20px 0;
    background: transparent; /* خليتها شفافة عشان تليق على خلفية موقعك */
    margin-top: 50px; /* مسافة بسيطة بينها وبين محتوى الصفحة */
}

.tech-tag {
    position: relative;
    padding: 8px 18px;
    border-radius: 8px;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight: 600;
    font-size: 14px;
    overflow: hidden;
    cursor: default;
}

/* ألوان الهوية */
.html-tag { background: #E34F26; }
.css-tag  { background: #1572B6; }
.js-tag   { background: #F7DF1E; color: #000; }

/* تأثير اللمعة */
.tech-tag::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.5),
        transparent
    );
    transform: skewX(-20deg);
    animation: flash 3s infinite ease-in-out;
}

@keyframes flash {
    0% { left: -150%; }
    50%, 100% { left: 200%; }
}

    
            
          </style>
</head>
<body>

    <header>
        <div class="container">
            <h1 onclick="location.reload()"><i class="fas fa-film"></i> 『فيلم شو』</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن فيلم...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
                <button id="favListBtn" title="قائمة المفضلات"><i class="fas fa-heart"></i></button>
            </div>
        </div>
    </header>

    <main>
        <div id="heroSection"></div>
        <div class="container">
            <div class="categories">
                <button class="cat-btn active" data-type="movie">أفلام</button>
                <button class="cat-btn" data-type="tv">مسلسلات</button>
                <button class="cat-btn" data-type="upcoming">قريباً 🕒</button>
                <button class="cat-btn" id="randomBtn">🎲 فيلم عشوائي</button>
                <button class="cat-btn" id="moodBtn">🎭 اختر مودك</button>
            </div>
            <div class="movies-grid" id="moviesGrid"></div>
        </div>
    </main>

    <footer>
        <div class="footer-credit">تم التطوير ❤️ بواسطة <span>Kranshy</span></div>
        <div class="footer-rights">© 2026 جميع الحقوق محفوظة لـ كرانشي - م / عمر اسامه</div>
    </footer>

    <script src="script.js"></script>
<footer class="tech-footer">
    <div class="tech-tag html-tag">HTML</div>
    <div class="tech-tag css-tag">CSS</div>
    <div class="tech-tag js-tag">JavaScript</div>
</footer>
<script src="https://pl29295378.profitablecpmratenetwork.com/d6/51/b6/d651b6bcb1aab9349f0b7c1d566532b2.js"></script>
</body>
</html>
